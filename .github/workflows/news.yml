name: Update medical news
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch news
        run: python3 scripts/fetch_news.py
      - name: Save
        run: |
          git config user.name "library-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "Nothing new" || (git commit -m "Update medical news" && git push)
      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow on every run resets that 60-day timer, so it never pauses.
      - name: Keep the hourly schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/news.yml/enable"
