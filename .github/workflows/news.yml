name: Update medical news
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Save
        run: |
          git config user.name "library-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "Nothing new" || (git commit -m "Update medical news" && git push)
